<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/registro.css">
    <link rel="stylesheet" href="./css/styles.css"><!---Nuevo estilo general-->

</head>

<body>
    <!-- Nav bar seccion -->
    <div id="navBar"></div>
    <!-- Contenido de la página -->
    <main class="registro container-fluid">
        <div class="row">
            <div
                class="col-12 col-lg-8 col-xl-6 d-flex justify-content-center justify-content-lg-end pe-lg-0 px-lg-4 justify-content-xl-center">
                <form class="tarjeta-form">
                    <h1 class="text-center">Crear una cuenta</h1>
                    <div class="alert alert-danger fade show " style="display: none;" role="alert"
                        id="alertValidaciones">
                        <p id="alertValidacionesTexto"></p>
                    </div>
                    <div>
                        <!-- -------------------Nombre usuario ----------------------------------------- -->
                        <div class="mb-3 campo" id="nombre">
                            <label for="txtNombre">Nombres:</label>
                            <input type="text" name="txtNombre" id="txtNombre" placeholder="Escribe tu nombre"
                                maxlength="30">
                        </div>
                        <!-- --------------------Apellido usuario--------------------------------------- -->
                        <div class="mb-3 campo" id="nombre">
                            <label for="txtApellido">Apellido(s):</label>
                            <input type="text" name="txtApellido" id="txtApellido" placeholder="Escribe tu apellido"
                                maxlength="20">
                        </div>
                        <!-------------------------------Correo usuario --------------------------------------------->
                        <div class="campo mb-3">
                            <label for="iptCorreo1">Correo electrónico:</label>
                            <div class="input-group grupo-correo">
                                <!-- Input para la parte antes del @ y MI cambie a iptCorreoDominio, tenia antes en input:required pattern="[a-z0-9._%+-]+"-->
                                <input type="text" name="iptCorreo1" id="iptCorreo1" placeholder="Correo" maxlength="65"
                                    title="Solo minúsculas, números, puntos y guiones">
                                <span class="input-group-text">@</span>
                                <!-- Select para elegir el dominio y MI después de "form-select" tenia required pero lo quite-->
                                <select id="selectDominio">
                                    <option value="">Otro dominio</option>
                                    <option value="gmail.com">gmail.com</option>
                                    <option value="outlook.com">outlook.com</option>
                                    <option value="hotmail.com">hotmail.com</option>
                                </select>
                            </div>
                            <!-- Input para dominio propio (visible solo si quiere otro dominio) MI -->
                            <input type="text" name="iptCorreoDominio" id="iptCorreoDominio"
                                placeholder="Escribe otro dominio si no esta en lista" maxlength="50">
                        </div>
                        <!---------------------------------Contraseña usuario ------------------------------------------->
                        <div class="mb-3 campo">
                            <label for="txtPassword">Contraseña:</label>
                            <input type="password" name="txtContraseña" id="txtPassword"
                                placeholder="Contraseña de al menos 8 caracteres" maxlength="30" required>
                        </div>
                        <!---------------------------------Confirmar contraseña usuario ------------------------------------------->
                        <div class="mb-3 campo">
                            <label for="txtConfirmPassword">Confirmar contraseña:</label>
                            <input type="password" name="txtConfirmacion" id="txtConfirmPassword"
                                placeholder="Escribe nuevamente tu contraseña" maxlength="30" required>
                        </div>
                        <!---------------------------------Teléfono usuario ------------------------------------------->
                        <div class="mb-3 campo">
                            <label for="txtTelefonoUsuario">Teléfono:</label>
                            <input type="tel" name="txtTelefonoUsuario" id="txtTelefonoUsuario"
                                placeholder="Escribe tu teléfono" maxlength="30">
                        </div>
                        <!---------------------------------Checkbox ------------------------------------------->
                        <div class="mb-3 promociones">
                            <input class="checkbox" type="checkbox" name="notificaciones" id="notificaciones">
                            <label for="notificaciones"> Quiero recibir promociones y anuncios ocasionales sobre
                                productos</label>
                        </div>
                        <!------------------------------- vínculo a login -------------------------------->
                        <div>
                            <p class="text-center">¿Ya tienes una cuenta?<wbr> <a href="login.html">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                    <!---------------------------------Boton Submit ------------------------------------------->
                    <div class="text-end">
                        <button type="submit" id="btnEnviar" class="boton boton--principal responsivo">Crear</button>
                    </div>
                </form>
            </div>
            <!-- ilustración de página -->
            <div class="col-12 col-lg-4 col-xl-6 d-flex flex-column justify-content-evenly align-items-center pb-3">
                <h4 class="text-center pt-5 pb-4 py-lg-0">Crea tu cuenta para empezar a comprar</h4>
                <div class="contenedor-img">
                    <img src="https://res.cloudinary.com/libretitaspi/image/upload/v1757025027/rprnjvzcxihefvjkhujg.svg"
                        alt="burrito-lazarillo">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer seccion -->
    <div id="footer-container"></div>
    <!-- Scripts -->
    <script src="./JS/validacionesRegistro.js"></script>
    <script src="./JS/navbar.js"></script>
    <script src="./JS/footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
