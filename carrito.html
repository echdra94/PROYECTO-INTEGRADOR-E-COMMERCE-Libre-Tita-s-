<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/styles.css"><!---Nuevo estilo general-->
</head>

<body>
  <div id="navBar"></div>
  <div class="container mt-5">
    <h1 class="mb-4">🛒 Carrito de Compras</h1>
    <h2 id="h2carrito"></h2>
    <img id="burroTriste" src="https://res.cloudinary.com/libretitaspi/image/upload/v1755200058/Recurso_5-8_zymqup.png"
      alt="vacio" style="display: none; max-width: 230px;">
    <br>

    <!-- Tabla de productos -->
    <div class="formulario-fondo">
      <table class="table table-bordered" id="tabla-carrito">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="lista-carrito">
          <!-- Aquí se insertan los productos con JS -->
        </tbody>
      </table>
    </div>
    <!-- Total -->
    <p id="total" class="fw-bold fs-5">Total: $0.00</p>

    <!-- Botón de Comprar -->
    <button id="comprar" class="btn btn-success mb-4">Finalizar Compra</button>
    <a href="tienda.html" class="btn btn-secondary mb-4">Seguir Comprando</a>
  </div>
  <div id="footer-container"></div>
  <script src="./JS/carrito.js"></script>
  
  <!-- alerta de compra exitosa -->
 <script>
  function mostrarAlertaBonita(mensaje) {
    const alerta = document.getElementById("alertaBonita");
    alerta.textContent = mensaje;
    alerta.classList.add("alerta-visible");

    setTimeout(() => {
      alerta.classList.remove("alerta-visible");
    }, 3000);
  }

  document.getElementById("comprar").addEventListener("click", () => {
    mostrarAlertaBonita("¡Gracias por tu compra!");
    localStorage.removeItem("carrito");
    setTimeout(() => location.reload(), 3200);
  });
</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="./JS/navbar.js"></script>
  <script src="./JS/footer.js"></script>

  <div id="alertaBonita" class="alerta-oculta"></div>
  

</body>

</html>
